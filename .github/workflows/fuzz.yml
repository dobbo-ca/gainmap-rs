name: fuzz
on:
  # Saturday 12:23 UTC: the free slot of the weekly fuzz schedule.
  schedule: [{ cron: '23 12 * * 6' }]
  workflow_dispatch:
    inputs:
      max_total_time:
        description: Seconds per target
        default: '600'
permissions:
  contents: read
# A new run waits for the one before it; it does not cancel it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # No fuzz-arm64 job: this crate has no SIMD kernel (the kernels are jpeg-rs's and av1-rs's and are fuzzed in their CI),
  # so the code is the same on both architectures.
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # Two fuzz jobs at a time, at most, so the fuzz run leaves hosted runners for CI.
      max-parallel: 2
      matrix:
        target: [read, decode, iso, mpf, xmp, scan]
    timeout-minutes: 60
    env:
      MAX_TOTAL_TIME: ${{ inputs.max_total_time || '600' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { lfs: false, persist-credentials: false }
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.CI_READ_APP_ID }}
          private-key: ${{ secrets.CI_READ_APP_KEY }}
          owner: dobbo-ca
          repositories: jpeg-rs,exif-rs,isobmff-rs,deflate-rs,hevc-rs,av1-rs
          permission-contents: read
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: .github/ci/Dockerfile
          target: fuzz
          load: true
          push: false
          cache-from: type=gha,scope=gainmap-rs-fuzz
          cache-to: type=gha,mode=max,scope=gainmap-rs-fuzz
          secrets: |
            gh_token=${{ steps.app.outputs.token }}
          tags: gainmap-fuzz:local
      # The corpus is kept between runs: restored here, copied into the container, copied back
      # out and saved, so a run goes on from where the last one stopped. One cache per target; the
      # newest is restored.
      - id: corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      # docker create + start, not a RUN layer: a BuildKit cache hit would skip the fuzzing.
      # Seeds: /seeds/<target>, made in the image by tests/fuzz/make-seeds.sh; new inputs go to the
      # first corpus dir. -malloc_limit_mb is the backstop; the targets also run under small Limits.
      - run: |
          mkdir -p corpus/${{ matrix.target }}
          docker create --name fuzz -e MAX_TOTAL_TIME -e TARGET=${{ matrix.target }} gainmap-fuzz:local \
            sh -c 'seeds=; for d in tests/fuzz/seeds/$TARGET /seeds/$TARGET; do [ -d $d ] && seeds="$seeds $d"; done; cargo +nightly fuzz run --fuzz-dir tests/fuzz $TARGET tests/fuzz/corpus/$TARGET $seeds -- -max_total_time=$MAX_TOTAL_TIME -max_len=1048576 -timeout=60 -rss_limit_mb=2048 -malloc_limit_mb=512'
          docker cp corpus fuzz:/src/tests/fuzz/
          docker start -a fuzz
      - if: failure()
        run: docker cp fuzz:/src/tests/fuzz/artifacts/${{ matrix.target }} ./crashers
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crashers-${{ matrix.target }}
          path: crashers
      - if: always()
        run: docker cp fuzz:/src/tests/fuzz/corpus/${{ matrix.target }}/. corpus/${{ matrix.target }}/ || true
      - if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: corpus
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
