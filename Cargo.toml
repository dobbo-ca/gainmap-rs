[package]
name = "gainmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Ultra HDR / ISO 21496-1 gain maps: read the SDR base, the gain map and its metadata from JPEG, HEIF and AVIF. Pure Rust, bounded on hostile input."
publish = false

[features]
default = ["heif", "avif"]
# HEVC decode of the base image and the gain map of a HEIC file. Off: `decode` gives
# `Error::Unsupported("hevc decode")`.
heif = ["dep:hevc"]
# AV1 decode of the base image and the gain map of an AVIF file. Off: `decode` gives
# `Error::Unsupported("av1 decode")`.
avif = ["dep:av1"]

[dependencies]
# Baseline and progressive JPEG decode of the SDR base and the gain-map image (docs/dependencies.md).
jpeg = { git = "https://github.com/dobbo-ca/jpeg-rs", rev = "c0cf0fcc3a5c4284bf09615cea44660247f07e99" }
# XMP packet parse (hdrgm, GContainer, Apple HDRGainMap properties).
exif = { git = "https://github.com/dobbo-ca/exif-rs", rev = "450c284659ee0cf6dfc91cf69aabfbc89c836781" }
# HEIF / AVIF boxes: items, iref, entity groups, auxC, item data.
isobmff = { git = "https://github.com/dobbo-ca/isobmff-rs", rev = "439720afc00ff988ff8e25fe3b2f932b09e809e2" }
# HEVC and AV1 decode of image items. Both use the isobmff rev above, so `&isobmff::Heif` is one
# type in all three crates: bump the three pins together.
hevc = { git = "https://github.com/dobbo-ca/hevc-rs", rev = "dc3aec975bac441183173870ce3c6a496100eb50", optional = true }
av1 = { git = "https://github.com/dobbo-ca/av1-rs", rev = "5b0f0d1f5d19460804b2c95b70a03572efa45e49", optional = true }

[profile.release]
codegen-units = 1
