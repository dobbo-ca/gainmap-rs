[package]
name = "gainmap"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
description = "Ultra HDR / ISO 21496-1 gain maps: read the SDR base, the gain map and its metadata from JPEG, HEIF and AVIF. Pure Rust, bounded on hostile input."
publish = false

[features]
default = ["heif", "avif"]
# HEVC decode of the base image and the gain map of a HEIC file. Off: `decode` gives
# `Error::Unsupported("hevc decode")`.
heif = ["dep:hevc", "dep:isobmff_tr"]
# AV1 decode of the base image and the gain map of an AVIF file. Off: `decode` gives
# `Error::Unsupported("av1 decode")`.
avif = ["dep:av1", "dep:isobmff_tr"]

[dependencies]
# Baseline and progressive JPEG decode of the SDR base and the gain-map image (docs/dependencies.md).
jpeg = { git = "https://github.com/dobbo-ca/jpeg-rs", rev = "22a2c3196d9afbd9df1e0fda2b6ca3caf590d38c" }
# XMP packet parse (hdrgm, GContainer, Apple HDRGainMap properties).
exif = { git = "https://github.com/dobbo-ca/exif-rs", rev = "c2e986828db71b63e0b436e8e44f41d9ebe77620" }
# HEIF / AVIF boxes: items, iref, entity groups, auxC, item data.
isobmff = { git = "https://github.com/dobbo-ca/isobmff-rs", rev = "26953d6120830fee8173964f7222e95f5cc3a35c" }
# isobmff-rs transform helper (apply_transforms). A second rev until hevc-rs and av1-rs move to it; then merge with the isobmff line above.
isobmff_tr = { package = "isobmff", git = "https://github.com/dobbo-ca/isobmff-rs", rev = "e69c81d32646e13de8b66f51729ff12101f9b3bc", optional = true }
# HEVC and AV1 decode of image items. Both use the isobmff rev above, so `&isobmff::Heif` is one
# type in all three crates: bump the three pins together.
hevc = { git = "https://github.com/dobbo-ca/hevc-rs", rev = "fee58e6df500cee3585d810541f8447667712e23", optional = true }
av1 = { git = "https://github.com/dobbo-ca/av1-rs", rev = "68e575a37b4d0de82c9212ee6503853f11deba45", optional = true }

[profile.release]
codegen-units = 1
